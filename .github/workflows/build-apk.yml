name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets sharp

    - name: Add Android platform (if missing)
      run: |
        if [ ! -d "android" ]; then
          npx cap add android
        fi

    - name: Generate Icons
      run: npx capacitor-assets generate --android

    - name: Sync Web to Android
      run: npx cap sync android

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/spx.keystore

    - name: Build Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease -Pandroid.injected.signing.store.file=spx.keystore -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} -Pandroid.injected.signing.key.alias=spx -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SPX-Tracker-Release-APK
        path: android/app/build/outputs/apk/release/app-release.apk
